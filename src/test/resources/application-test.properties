# Cấu hình cho test API (JUnit 5 + @SpringBootTest + MockMvc), theo đặc tả mục 2.2.
# Dùng: @SpringBootTest @AutoConfigureMockMvc @ActiveProfiles("test")
#       @DirtiesContext(classMode = DirtiesContext.ClassMode.AFTER_CLASS)
# Mỗi context là một CSDL H2 trong bộ nhớ mới, DataSeeder nạp lại dữ liệu mẫu (đặc tả mục 8).
spring.datasource.url=jdbc:h2:mem:qlkho-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.show-sql=false
logging.level.root=warn
logging.level.com.qlkho=info
