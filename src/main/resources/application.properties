# ---------- Máy chủ ----------
# Render/Railway truyền cổng qua biến PORT; chạy local mặc định 8080
server.port=${PORT:8080}
# Chạy sau proxy HTTPS của Render: nhận đúng scheme/host từ header X-Forwarded-*
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h
spring.application.name=qlkho-web

# ---------- CSDL mặc định: H2 lưu thành file ./data/qlkho.mv.db (không cần cài đặt) ----------
spring.datasource.url=jdbc:h2:file:./data/qlkho;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Xem dữ liệu trực tiếp: http://localhost:8080/h2-console  (JDBC URL như trên, user sa, mật khẩu trống)
spring.h2.console.enabled=true

# Tự tạo/cập nhật bảng từ các lớp @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# BUG-006: không cho Jackson cắt số thập phân thành số nguyên (1.5 → 1) khi đọc JSON.
# Giá trị như 1.5 cho các trường Integer (qty, actual, minStock, capacity…) sẽ bị từ chối 400 "Dữ liệu gửi lên không hợp lệ."
spring.jackson.deserialization.accept-float-as-int=false

# ---------- Upload hồ sơ PDF (nội dung lưu trong CSDL) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------- AUTH-08: quên mật khẩu, gửi mã OTP qua email ----------
# Cách gửi: smtp (mặc định: Mailpit ở localhost:1025), brevo (HTTP API, dùng trên Render) hoặc log (chỉ in ra log, để dev)
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:no-reply@qlkho.local}
app.mail.from-name=${MAIL_FROM_NAME:Quản lý kho}
app.mail.brevo-api-key=${BREVO_API_KEY:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
# Thời hạn và giới hạn (BR-29..BR-33). Instance chạy e2e có thể rút ngắn để test hết hạn mà không phải chờ lâu.
app.reset.otp-ttl-seconds=${RESET_OTP_TTL_SECONDS:300}
app.reset.token-ttl-seconds=${RESET_TOKEN_TTL_SECONDS:600}
app.reset.resend-cooldown-seconds=${RESET_RESEND_COOLDOWN_SECONDS:60}
app.reset.max-otp-attempts=5
app.reset.max-requests-per-phone-hour=5
app.reset.max-requests-per-ip-hour=${RESET_MAX_PER_IP_HOUR:20}
app.reset.max-verifies-per-ip-hour=${RESET_MAX_VERIFY_PER_IP_HOUR:30}
