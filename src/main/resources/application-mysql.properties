# Chạy với MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Sửa username/password cho đúng máy của bạn. CSDL "qlkho" sẽ được tự tạo nếu chưa có.
spring.datasource.url=jdbc:mysql://localhost:3306/qlkho?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
