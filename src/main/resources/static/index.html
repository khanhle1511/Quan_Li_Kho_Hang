<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý kho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#17212B;background:#F4F6F8;line-height:1.4}
button,input,textarea{font:inherit}
a{color:#1A56C4}
a.btn{text-decoration:none;color:#17212B}
:focus-visible{outline:2px solid #1A56C4;outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #CBD2DA;background:#FFFFFF;color:#17212B;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F1F4F7}
.btn-primary{background:#1A56C4;border-color:#1A56C4;color:#FFFFFF}
.btn-primary:hover{background:#154AAB}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-link{color:#1A56C4}
.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CBD2DA;background:#FFFFFF;color:#2B3540;font-size:13px;font-weight:500;cursor:pointer}
.pill.on{background:#1A56C4;border-color:#1A56C4;color:#FFFFFF}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3D4753}
.input{min-height:40px;padding:0 12px;border:1px solid #CBD2DA;border-radius:8px;font-size:14px;font-weight:400;color:#17212B;background:#FFFFFF;width:100%}
.input:focus{outline:2px solid #1A56C4;outline-offset:-1px;border-color:#1A56C4}
.card{background:#FFFFFF;border:1px solid #E1E6EB;border-radius:12px}
.kpi{padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:inherit}
.kpi:hover{border-color:#AEB9C5}
.cardhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid #EEF1F4}
.h2{margin:0;font-size:16px;font-weight:600}
.lbl{font-size:13px;font-weight:500;color:#3D4753}
.muted{color:#56606B}
.small{font-size:12px}
.scroll{overflow-x:auto}
.thead{display:grid;gap:12px;padding:10px 20px;background:#F7F9FB;border-bottom:1px solid #E1E6EB;font-size:12px;font-weight:600;color:#56606B}
.trow{display:grid;gap:12px;padding:12px 20px;border-bottom:1px solid #EEF1F4;align-items:center;font-size:14px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.layout{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}
aside{flex:1 1 240px;background:#FFFFFF;border-right:1px solid #E1E6EB;padding:20px 14px;display:flex;flex-direction:column;gap:2px}
main{flex:999 1 560px;min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:8px;font-size:14px;font-weight:500;text-align:left;cursor:pointer;background:transparent;color:#3D4753}
.nav:hover{box-shadow:inset 0 0 0 1px #D5DBE2}
.nav.on{background:#E8EEFB;color:#1A4FB8;font-weight:600}
.navgroup{font-size:12px;font-weight:600;color:#5F6B77;padding:14px 12px 6px}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#933A00;color:#FFFFFF;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border:1px solid #E1E6EB;border-radius:8px;background:#FFFFFF;font-size:14px;color:inherit;cursor:pointer;text-align:left}
.pick:hover{border-color:#1A56C4;background:#F5F8FE}
.addic{font-size:13px;font-weight:600;color:#1A56C4;white-space:nowrap}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E1E6EB;border-radius:8px}
.empty{padding:20px;border:1px dashed #CBD2DA;border-radius:8px;text-align:center;color:#56606B;font-size:14px}
.alert-err{padding:10px 14px;border-radius:8px;background:#FDE3E1;color:#8E1B14;font-size:14px}
.notice{padding:12px 14px;border-radius:8px;background:#EEF3FD;color:#1C3F85;font-size:14px}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #EEF1F4}
.col{display:flex;flex-direction:column}
.g20{gap:20px}.g16{gap:16px}.g10{gap:10px}.g8{gap:8px}
.wrap{display:flex;flex-wrap:wrap}
input[type=checkbox]{width:18px;height:18px;accent-color:#1A56C4}
.toast{position:fixed;right:24px;bottom:24px;max-width:420px;padding:14px 18px;border-radius:10px;color:#FFFFFF;font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(15,23,42,.18);z-index:50;overflow-wrap:anywhere}
.logo{border-radius:9px;background:#1A56C4;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:640px){main{padding:20px 16px 40px}}
/* ---- login ---- */
.auth{min-height:100vh;display:flex;flex-wrap:wrap;background:#F4F6F8}
.auth-brand{flex:1 1 520px;position:relative;overflow:hidden;color:#FFFFFF;background-color:#0F2742;background-image:radial-gradient(circle at 18% 12%,rgba(64,128,240,.38),transparent 55%),radial-gradient(circle at 85% 90%,rgba(242,183,5,.10),transparent 45%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:auto,auto,22px 22px;padding:40px 48px 64px;display:flex;flex-direction:column;gap:24px}
.auth-brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,#F2B705 0 14px,#13263D 14px 28px)}
.auth-title{margin:0;font-size:clamp(28px,3vw,40px);line-height:1.15;font-weight:700;letter-spacing:-.01em;max-width:520px}
.auth-sub{margin:0;color:#B9C7DA;font-size:15px;line-height:1.6;max-width:480px}
.scene{position:relative;flex:1;min-height:320px;display:flex;align-items:center;justify-content:center}
.scene svg{width:100%;max-width:560px;height:auto;filter:drop-shadow(0 28px 32px rgba(0,0,0,.40))}
.float{position:absolute;background:rgba(255,255,255,.97);color:#17212B;border-radius:12px;padding:10px 14px 10px 10px;box-shadow:0 2px 4px rgba(3,12,28,.20),0 14px 34px rgba(3,12,28,.38);display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3}
.float b{font-size:16px}
.ftile{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.f1{top:4%;left:0}.f2{top:42%;right:0}.f3{bottom:2%;left:8%}
.feats{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:#D5DEEA}
.feats span{display:inline-flex;align-items:center;gap:8px}
.auth-form{flex:1 1 440px;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:440px;background:#FFFFFF;border:1px solid #E1E6EB;border-radius:16px;padding:36px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 18px 44px rgba(16,24,40,.11);display:flex;flex-direction:column;gap:18px}
.ifield{position:relative}
.ifield .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#7A8591;pointer-events:none}
.ifield .input{padding-left:42px;min-height:46px;border-radius:10px}
.ifield .input.has-eye{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:#56606B;cursor:pointer;display:flex;align-items:center;justify-content:center}
.eye:hover{background:#F1F4F7}
.linkbtn{border:0;background:none;padding:0;color:#1A56C4;font-size:13px;font-weight:500;cursor:pointer}
.linkbtn:disabled{color:#8A94A0;cursor:default}
.otp-input{letter-spacing:.5em;font-size:22px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.linkbtn:hover{color:#123F92;text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px;color:#56606B;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#E1E6EB}
.rolecard{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid #E1E6EB;border-radius:10px;background:#FFFFFF;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s,box-shadow .15s}
.rolecard:hover{border-color:#AEB9C5}
.rolecard.on{border-color:#1A56C4;box-shadow:0 0 0 3px rgba(26,86,196,.14)}
.rtile{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.enter{animation:rise .5s ease-out both}
.enter.d2{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.rolecard{transition:none}}
/* ---- homepage ---- */
.home{position:fixed;inset:0;z-index:20;overflow:hidden;color:#FFFFFF;background-color:#0B2038;background-image:radial-gradient(circle at 15% 10%,rgba(64,128,240,.45),transparent 50%),radial-gradient(circle at 90% 85%,rgba(242,183,5,.12),transparent 45%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:auto,auto,22px 22px;display:flex;flex-direction:column;padding:24px 48px 0;transition:transform .65s cubic-bezier(.7,0,.2,1);touch-action:none;user-select:none;cursor:grab}
.home.dragging{transition:none;cursor:grabbing}
.home.leaving{transform:translateY(-100%)}
.home::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,#F2B705 0 14px,#13263D 14px 28px)}
.home-nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.home-main{flex:1;min-height:0;display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:12px 0}
.home-copy{flex:1 1 440px;display:flex;flex-direction:column;gap:22px;max-width:620px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:13px;color:#DCE5F0}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 4px rgba(242,183,5,.2)}
.home-title{margin:0;font-size:clamp(38px,5.2vw,68px);line-height:1.04;font-weight:700;letter-spacing:-.025em}
.home-title em{font-style:normal;color:#F2B705}
.home-sub{margin:0;font-size:17px;line-height:1.6;color:#B9C7DA;max-width:540px}
.hfeat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:540px}
.hfeat span{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:14px;color:#E6ECF4}
.hfeat b{display:flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;background:rgba(242,183,5,.16);color:#F2B705;flex:none}
.home-art{flex:1 1 460px;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.home-art svg{width:100%;max-width:600px;max-height:62vh;height:auto;filter:drop-shadow(0 30px 34px rgba(0,0,0,.45))}
.swipe{align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 26px;padding:10px 22px;border:0;border-radius:14px;background:transparent;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer}
.swipe:hover{background:rgba(255,255,255,.08)}
.swipe .chev{display:flex;flex-direction:column;align-items:center;color:#F2B705;animation:nudge 1.6s ease-in-out infinite}
.swipe .chev svg+svg{margin-top:-10px;opacity:.55}
.swipe small{font-size:12px;font-weight:400;color:#9FB0C6}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}
.backhome{position:absolute;top:20px;right:24px;z-index:2}
@media (max-width:760px){.home{padding:18px 20px 0}.home-art{display:none}.hfeat{grid-template-columns:1fr}.home-sub{font-size:15px}}
@media (max-height:700px){.home-art{display:none}}
@media (prefers-reduced-motion:reduce){.home{transition:none}.swipe .chev,.rise{animation:none}}
/* ---- partners ---- */
.hp{display:flex;align-items:center;gap:10px;border-radius:8px;padding:4px;margin:-4px;cursor:default;outline:none}
.hp:hover,.hp:focus-visible{background:#F2F6FD}
.hp:focus-visible{box-shadow:0 0 0 2px #1A56C4}
.linkchip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid #D9E0E8;background:#FFFFFF;color:#2B3540;font-size:13px;cursor:pointer;white-space:nowrap}
.linkchip:hover{border-color:#1A56C4;color:#1A4FB8}
.linkchip.ok{background:#E8F4EE;border-color:#BFE0CC;color:#13643A}
.linkchip.warn{background:#FFF3D1;border-color:#F3DFA6;color:#8A4B00}
.drop{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border:2px dashed #CBD2DA;border-radius:12px;background:#FAFBFC;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:#B42318;background:#FFF6F5}
.drop:focus-within{outline:2px solid #1A56C4;outline-offset:2px}
.filerow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #E1E6EB;border-radius:10px;flex-wrap:wrap}
.pdfic{width:38px;height:46px;border-radius:6px;background:#B42318;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;flex:none;box-shadow:inset 0 10px 0 rgba(255,255,255,.15)}
.hpop{position:fixed;z-index:60;width:340px;max-width:calc(100vw - 24px);background:#FFFFFF;border:1px solid #E1E6EB;border-radius:14px;box-shadow:0 2px 6px rgba(15,23,42,.08),0 22px 50px rgba(15,23,42,.22);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .14s ease-out,transform .14s ease-out;font-size:13px;color:#17212B}
.hpop.show{opacity:1;transform:none}
.hpop .hp-head{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #EEF1F4}
.hpop .hp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 16px}
.hpop .hp-grid div{padding:8px 10px;border-radius:10px;background:#F7F9FB}
.hpop .hp-grid b{display:block;font-size:17px}
.hpop .hp-sec{padding:0 16px 12px;display:flex;flex-direction:column;gap:4px}
.hpop .hp-foot{padding:10px 16px;background:#F7F9FB;border-top:1px solid #EEF1F4;color:#56606B;font-size:12px;border-radius:0 0 14px 14px}
@media (prefers-reduced-motion:reduce){.hpop{transition:none}}
/* ---- warehouse link ---- */
.whlink{display:flex;align-items:center;gap:10px;padding:6px;margin:-6px;border:0;border-radius:10px;background:transparent;color:inherit;text-align:left;cursor:pointer;width:calc(100% + 12px)}
.whlink:hover{background:#F2F6FD}
.whlink:hover b{color:#1A4FB8;text-decoration:underline}
.whlink-go{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#1A56C4}
/* ---- keeper picker ---- */
.keeperbox{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid #CBD2DA;border-radius:12px;background:#FFFFFF;color:inherit;flex-wrap:wrap}
.keeperbox.empty{border-style:dashed;cursor:pointer;background:#FAFBFC}
.keeperbox.empty:hover{border-color:#1A56C4;background:#F5F8FE}
.kpick-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid #E1E6EB;border-radius:12px;background:#FFFFFF;color:inherit;cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.kpick-row:hover{border-color:#1A56C4;background:#F5F8FE}
.kpick-row.on{border-color:#1A56C4;box-shadow:0 0 0 3px rgba(26,86,196,.14);background:#FAFCFF}
.kpick-go{font-size:13px;font-weight:600;color:#1A56C4;flex:none}
.kstatus{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
.kstatus.busy{background:#EEF3FD;color:#1C3F85}
.kstatus.free{background:#E1F3E8;color:#13643A}
/* ---- modal ---- */
.btn-danger{background:#B42318;border-color:#B42318;color:#FFFFFF}
.btn-danger:hover{background:#951C12}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-muted{color:#8A939E}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .18s ease-out}
.dialog{width:100%;max-width:520px;background:#FFFFFF;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.35);overflow:hidden;animation:pop .22s cubic-bezier(.2,.7,.2,1)}
.dialog-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog-foot{padding:16px 24px;background:#F7F9FB;border-top:1px solid #EEF1F4;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dicon{width:48px;height:48px;border-radius:12px;background:#FDE3E1;color:#B42318;display:flex;align-items:center;justify-content:center;flex:none}
.keep{border:1px solid #CFE3D7;background:#F1F9F4;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.keep ul{margin:0;padding-left:18px;color:#2B3540}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.overlay,.dialog{animation:none}}
/* ---- module screens ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{display:flex;gap:14px;align-items:center;padding:16px 18px}
.statbtn{width:100%;text-align:left;color:inherit;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}
.statbtn:hover{transform:translateY(-2px);border-color:#AEB9C5;box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.10)}
.statbtn.on{border-color:var(--ring);box-shadow:0 0 0 3px var(--ringsoft),0 10px 24px rgba(16,24,40,.08)}
.statbtn .tick{position:absolute;top:10px;right:12px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ringsoft);color:var(--ring)}
@media (prefers-reduced-motion:reduce){.statbtn{transition:none}.statbtn:hover{transform:none}}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.optcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid #E1E6EB;border-radius:12px;background:#FFFFFF;cursor:pointer;text-align:left;color:inherit;transition:border-color .15s,box-shadow .15s}
.optcard:hover{border-color:#AEB9C5}
.optcard.on{border-color:#1A56C4;box-shadow:0 0 0 3px rgba(26,86,196,.14);background:#FAFCFF}
.avatar{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.step{display:flex;gap:14px;align-items:flex-start}
.stepn{width:28px;height:28px;border-radius:50%;background:#0F2742;color:#FFFFFF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 4px #E8EEF7}
.steph{font-size:15px;font-weight:600;line-height:28px}
.slip{border:1px solid #E1E6EB;border-radius:14px;overflow:hidden;background:#FFFFFF;box-shadow:0 2px 4px rgba(16,24,40,.04),0 14px 32px rgba(16,24,40,.09)}
.sliphead{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.slipline{padding:12px 16px;border-top:1px solid #EEF1F4;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.slipfoot{padding:14px 16px;border-top:1px dashed #CBD2DA;background:#F9FAFB;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px}
.stepper{display:inline-flex;align-items:stretch;border:1px solid #CBD2DA;border-radius:8px;overflow:hidden;background:#FFFFFF}
.stepper button{width:34px;min-height:38px;border:0;background:#F7F9FB;cursor:pointer;color:#3D4753;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:#EEF1F4}
.stepper input{width:72px;border:0;border-left:1px solid #E1E6EB;border-right:1px solid #E1E6EB;text-align:right;padding:0 8px;font-size:14px;color:#17212B;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:2px solid #1A56C4;outline-offset:-2px}
.warn{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.procitem{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;background:#F7F9FB;border:1px solid #EEF1F4}
.trow.hl{background:#FFF8EC}
.lvl{position:relative;height:8px;border-radius:4px;background:#EEF1F4}
.lvl span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.lvl i{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#0F2742;border-radius:1px}
.sessionbar{border-radius:14px;padding:18px 20px;background:linear-gradient(135deg,#FFF7E0,#FFFFFF 60%);border:1px solid #F3DFA6;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(138,90,0,.08)}
.mini{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:10px;background:#FFFFFF;border:1px solid #EEF1F4;min-width:96px}
.mini b{font-size:18px}
.chartwrap svg{width:100%;height:auto;display:block}
/* ---- dashboard ---- */
.card{box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05)}
.hero{position:relative;overflow:hidden;border-radius:16px;color:#FFFFFF;background-color:#0F2742;background-image:radial-gradient(circle at 12% 0%,rgba(64,128,240,.45),transparent 55%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:auto,22px 22px;padding:28px 32px 36px;display:flex;align-items:center;gap:24px;box-shadow:0 2px 4px rgba(15,39,66,.18),0 18px 40px rgba(15,39,66,.22)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,#F2B705 0 12px,#13263D 12px 24px)}
.hero-art{flex:0 0 300px;margin:-12px -8px -20px 0}
.hero-art svg{width:100%;height:auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.4))}
.hbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#FFFFFF}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.solid{background:#FFFFFF;color:#0F2742;border-color:#FFFFFF}
.hbtn.solid:hover{background:#E8EEF7}
.hstat{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.10);font-size:13px;color:#DCE5F0}
.hstat b{color:#FFFFFF}
.kpi2{padding:18px 20px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;color:inherit;transition:transform .15s,box-shadow .15s}
.kpi2:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.06),0 14px 30px rgba(16,24,40,.10)}
.ktile{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.meter{height:6px;border-radius:999px;background:#EEF1F4;overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#56606B}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 96px;gap:14px;align-items:center;padding:7px 0;font-size:13px}
.btrack{position:relative;height:12px;border-radius:6px;background:#EEF1F4}
.bfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:left center}
.bmin{position:absolute;top:-4px;bottom:-4px;width:2px;background:#0F2742;border-radius:1px}
.grow .bfill,.grow .meter span{animation:growx .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.meter span{transform-origin:left center}
.tl{position:relative;padding:12px 20px 12px 64px;border-bottom:1px solid #EEF1F4}
.tl::before{content:"";position:absolute;left:37px;top:0;bottom:0;width:2px;background:#EEF1F4}
.tl:first-child::before{top:24px}
.tl:last-child::before{bottom:calc(100% - 24px)}
.tdot{position:absolute;left:24px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #FFFFFF}
@media (max-width:560px){.brow{grid-template-columns:1fr auto;gap:6px 12px}.brow .btrack{grid-column:1 / -1;grid-row:2}}
@media (max-width:860px){.hero-art{display:none}.hero{padding:24px 20px 32px}}
@media (prefers-reduced-motion:reduce){.grow .bfill,.grow .meter span{animation:none}.kpi2{transition:none}}
@media (max-width:960px){.scene{display:none}.auth-brand{flex-basis:100%;padding:28px 24px 40px}}
/* USR-07: bảng trượt lịch sử hoạt động */
.overlay-right{align-items:stretch;justify-content:flex-end;padding:0}
/* chọn theo .overlay-right>.drawer để thắng quy tắc chung aside{flex:1 1 240px;padding…} của thanh menu */
.overlay-right>.drawer{flex:0 0 auto;width:min(700px,100%);max-width:700px;height:100%;padding:0;gap:0;border-right:0;background:#FFFFFF;box-shadow:-20px 0 60px rgba(15,23,42,.3);display:flex;flex-direction:column;overflow:hidden;animation:slidein .22s cubic-bezier(.2,.7,.2,1)}
.drawer-body{flex:1;overflow:auto}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.ulink{background:none;border:0;padding:0;font:inherit;font-weight:600;color:#1A4FB8;cursor:pointer;text-align:left}
.ulink:hover,.ulink:focus-visible{text-decoration:underline}
.act-day{position:sticky;top:0;z-index:1;background:#F7F9FB;padding:8px 20px;font-size:12px;font-weight:600;color:#56606B;border-bottom:1px solid #E1E6EB}
.act-item .tdot{width:26px;height:26px;left:25px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}

<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  // ---------- helpers ----------
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString('vi-VN');
  const sign = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const pad = (n, k) => String(n).padStart(k, '0');
  const now = () => { const d = new Date(); return pad(d.getDate(), 2) + '/' + pad(d.getMonth() + 1, 2) + '/' + d.getFullYear() + ' ' + pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2); };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const ICON = {
    box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
    dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    in: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    out: '<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>',
    stocktake: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
    inventory: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>',
    alerts: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    receipts: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>',
    reports: '<path d="M3 3v18h18"/><path d="M8 17v-6"/><path d="M13 17V7"/><path d="M18 17v-4"/>',
    products: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    partners: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeOff: '<path d="m3 3 18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.6 4.9-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
    suppliers: '<path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    customers: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/><path d="M10 21v-5h4v5"/>',
    warehouses: '<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>',
    pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    chevUp: '<path d="m6 15 6-6 6 6"/>',
    arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    minus: '<path d="M5 12h14"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'
  };

  // Isometric warehouse illustration (static, built once)
  const SCENE = (function () {
    const s = 26, pts = [];
    const P = (x, y, z) => { const X = (x - y) * s * 0.866, Y = (x + y) * s * 0.5 - z * s; pts.push([X, Y]); return X.toFixed(1) + ',' + Y.toFixed(1); };
    const poly = (a, fill, extra) => '<polygon points="' + a.join(' ') + '" fill="' + fill + '"' + (extra || '') + '/>';
    const box = (x, y, z, w, d, h, c) =>
      poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], c[0]) +
      poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], c[1]) +
      poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], c[2]);
    const CARD = ['#E9BB7B', '#C58C4B', '#A6713A'], BLUE = ['#6A9EF3', '#3471DA', '#2659B4'], WOOD = ['#8F6F4C', '#715539', '#5B442D'];
    const STEEL = ['#A9BCD0', '#7189A3', '#5B708A'], BOARD = ['#D0DAE5', '#97AABF', '#7C90A7'];
    let o = '';
    o += poly([P(-0.6, -0.6, 0), P(9.2, -0.6, 0), P(9.2, 7.2, 0), P(-0.6, 7.2, 0)], '#17324F');
    for (let i = 0; i <= 9; i++) o += '<line x1="' + P(i, -0.6, 0).split(',')[0] + '" y1="' + P(i, -0.6, 0).split(',')[1] + '" x2="' + P(i, 7.2, 0).split(',')[0] + '" y2="' + P(i, 7.2, 0).split(',')[1] + '" stroke="rgba(255,255,255,.06)"/>';
    for (let j = 0; j <= 7; j++) o += '<line x1="' + P(-0.6, j, 0).split(',')[0] + '" y1="' + P(-0.6, j, 0).split(',')[1] + '" x2="' + P(9.2, j, 0).split(',')[0] + '" y2="' + P(9.2, j, 0).split(',')[1] + '" stroke="rgba(255,255,255,.06)"/>';
    const a = P(-0.6, 2.4, 0).split(','), b = P(9.2, 2.4, 0).split(',');
    o += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#F2B705" stroke-width="2.5" stroke-dasharray="10 8" opacity=".85"/>';
    // rack
    o += box(0, 0, 0, 0.15, 0.15, 4.4, STEEL) + box(5.85, 0, 0, 0.15, 0.15, 4.4, STEEL);
    const levels = [
      { z: 0, items: [[0.3, CARD], [1.5, CARD], [2.7, CARD], [4.4, BLUE]] },
      { z: 1.5, items: [[0.3, CARD], [1.5, BLUE], [3.9, CARD]] },
      { z: 3.0, items: [[0.5, CARD], [1.7, CARD], [3.2, BLUE], [4.4, CARD]] }
    ];
    levels.forEach((L) => {
      o += box(0, 0, L.z, 6, 1.3, 0.12, BOARD);
      L.items.forEach((it) => { o += box(it[0], 0.2, L.z + 0.12, 1.05, 0.95, 0.95, it[1]); });
    });
    o += box(0, 1.15, 0, 0.15, 0.15, 4.4, STEEL) + box(5.85, 1.15, 0, 0.15, 0.15, 4.4, STEEL);
    // pallet 1 (full)
    o += box(0.6, 3.2, 0, 2.2, 1.8, 0.22, WOOD);
    const p1 = [[0.65, 3.25, 0.22], [0.65, 4.1, 0.22], [1.75, 3.25, 0.22], [1.75, 4.1, 0.22], [0.65, 3.25, 1.07], [0.65, 4.1, 1.07], [1.75, 3.25, 1.07]];
    p1.sort((u, v) => (u[0] + u[1]) - (v[0] + v[1]) || u[2] - v[2]).forEach((q) => { o += box(q[0], q[1], q[2], 1.0, 0.85, 0.85, CARD); });
    // pallet 2 (almost empty → low-stock marker)
    o += box(4.0, 3.2, 0, 2.2, 1.8, 0.22, WOOD);
    o += poly([P(4.05, 3.25, 0.22), P(6.15, 3.25, 0.22), P(6.15, 4.95, 0.22), P(4.05, 4.95, 0.22)], 'none', ' stroke="#F2B705" stroke-width="2" stroke-dasharray="6 5"');
    o += box(4.05, 3.25, 0.22, 1.0, 0.85, 0.85, BLUE);
    const m = P(5.6, 4.4, 1.9).split(',');
    o += '<circle cx="' + m[0] + '" cy="' + m[1] + '" r="13" fill="#F2B705"/><text x="' + m[0] + '" y="' + (Number(m[1]) + 5.5) + '" text-anchor="middle" font-size="16" font-weight="700" fill="#0F2742" font-family="system-ui,sans-serif">!</text>';
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const minX = Math.min.apply(null, xs) - 16, minY = Math.min.apply(null, ys) - 22, w = Math.max.apply(null, xs) - minX + 16, h = Math.max.apply(null, ys) - minY + 16;
    return '<svg viewBox="' + minX.toFixed(0) + ' ' + minY.toFixed(0) + ' ' + w.toFixed(0) + ' ' + h.toFixed(0) + '" role="img" aria-label="Minh họa kho hàng với kệ và pallet">' + o + '</svg>';
  })();
  let loginAnimated = false;
  const svg = (name, size) => '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';

  // ---------- seed data ----------
  function seed() {
    return {
      home: true, loggedIn: false, role: 'manager', meName: '', meUser: '', screen: 'dashboard',
      login: { user: '0902222222', pass: '123456', err: '', show: false, remember: true },
      users: [],
      warehouses: [],
      products: [],
      stock: {},
      suppliers: [],
      customers: [],
      receipts: [],
      history: [],
      seq: { in: 1, out: 1, kk: 1 }, pub: null,
      draft: {
        in: { partner: '', wh: '', note: '', search: '', lines: [] },
        out: { partner: '', wh: '', note: '', search: '', lines: [] }
      },
      err: { in: '', out: '' },
      kk: { wh: '', active: false, started: '', rows: [], err: '' },
      kkList: [],
      inv: { q: '', wh: 'all', low: false, card: null },
      rep: { wh: 'all' },
      dash: { wh: 'all' },
      rcf: { in: 'all', out: 'all' },
      uq: '', ufilter: 'all',
      udel: null,
      uf: { mode: null, id: null, name: '', phone: '', email: '', pass: '', role: 'staff', opened: '', status: 'draft', show: false, err: '' },
      prodQ: '',
      pf: { open: false, sku: '', name: '', cat: '', unit: '', min: '', price: '', err: '' },
      ptab: 'sup',
      wq: '', wfil: 'all', wdel: null, kpick: null,
      wf: { open: false, mode: 'create', id: null, code: '', name: '', address: '', keeperId: '', phone: '', capacity: '', opened: '', status: 'active', err: '' },
      pform: { open: false, mode: 'create', id: null, name: '', phone: '', email: '', address: '', note: '', err: '' },
      pq: '', pfil: 'all', pdetail: null, pnote: '',
      rb: { q: '', type: 'all', status: 'all', wh: 'all', admin: false, page: 1 }, // RCPT-10: bộ lọc sổ phiếu
      rview: null, // RCPT-10: mã phiếu đang mở popup
      act: null, // USR-07: { id, data, err, cat, q } khi bảng lịch sử đang mở
      fp: null, // AUTH-08: luồng quên mật khẩu đang mở (null = đang ở form đăng nhập), xem blankFP()
      toast: null
    };
  }

  // ---------- state ----------
  let S = seed();
  let H = [];
  let toastTimer = null;
  const root = document.getElementById('app');

  function upd(fn) { const n = clone(S); fn(n); S = n; render(); }
  function say(text, tone) {
    clearTimeout(toastTimer);
    upd((n) => { n.toast = { text, tone: tone || 'ok' }; });
    toastTimer = setTimeout(() => upd((n) => { n.toast = null; }), 4200);
  }
  const on = (fn) => { H.push(fn); return H.length - 1; };
  const prod = (id) => S.products.find((p) => p.id === id) || { name: id, unit: '', min: 0, sku: '' };
  const whName = (id) => { const w = S.warehouses.find((x) => x.id === id); return w ? w.name : id; };
  const have = (pid, wh) => S.stock[pid + '|' + wh] || 0;
  const partnerName = (id) => { const x = S.suppliers.concat(S.customers).find((p) => p.id === id); return x ? x.name : id; };
  const ROLE = { admin: 'Quản trị viên', manager: 'Quản lý kho', staff: 'Nhân viên kho' };
  const ST = { pending: { t: 'Chờ duyệt', bg: '#FFF1DB', fg: '#8A4B00' }, approved: { t: 'Đã duyệt', bg: '#E1F3E8', fg: '#13643A' }, cancelled: { t: 'Đã từ chối', bg: '#ECEEF1', fg: '#454F5B' } };

  // ---------- API (Spring Boot) ----------
  async function api(method, url, body) {
    const opt = { method, headers: {}, credentials: 'same-origin' };
    if (body instanceof FormData) opt.body = body;
    else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let res;
    try { res = await fetch(url, opt); } catch (e) { throw new Error('Không kết nối được máy chủ. Hãy kiểm tra ứng dụng Java đang chạy (http://localhost:8080).'); }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401 && S.loggedIn) { sessionExpired(data && data.error); throw new Error((data && data.error) || 'Phiên đăng nhập đã hết hạn.'); }
    if (!res.ok) throw new Error((data && data.error) || ('Lỗi máy chủ (' + res.status + ').'));
    return data;
  }

    FILES = {};

    upd((n) => {
      ['users', 'warehouses', 'products', 'stock', 'suppliers', 'customers', 'receipts', 'history', 'kkList'].forEach((k) => { n[k] = d[k]; });
      n.seq = d.seq; n.role = d.me.role; n.meName = d.me.name; n.meUser = d.me.id; n.loggedIn = true; n.home = false;
      const act = n.warehouses.filter((w) => w.status !== 'paused'); const first = (act[0] || n.warehouses[0] || {}).id || '';
      ['in', 'out'].forEach((t) => {
        if (!act.some((w) => w.id === n.draft[t].wh)) n.draft[t].wh = first;
        const parts = t === 'in' ? n.suppliers : n.customers;
        if (!parts.some((x) => x.id === n.draft[t].partner)) n.draft[t].partner = (parts[0] || {}).id || '';

  // ---------- AUTH-08: quên mật khẩu, đặt lại bằng mã OTP gửi qua email ----------
  const OTP_LEN = 6;
  const PASS_MIN = 6;

  const passOk = (p) => p.length >= PASS_MIN && !/\s/.test(p);
  const setFP = (patch) => upd((n) => { Object.assign(n.fp, patch); });
  const focusField = (fid) => { const el = root.querySelector('[data-fid="' + fid + '"]'); if (el) el.focus(); };
  let fpTimer = null;
  /** Vẽ lại mỗi giây cho đồng hồ đếm ngược ở bước nhập mã; tự dừng khi rời bước đó. */
  function startFpTimer() {

  /** Chạy một bước gọi API: chặn bấm hai lần, hiện lỗi máy chủ trong khung. */
  async function fpRun(work) {
    if (S.fp.busy) return;
    setFP({ busy: true, err: '' });
    try { await work(); } catch (e) { if (S.fp) setFP({ err: e.message }); } finally { if (S.fp) setFP({ busy: false }); }
  }
  function fpSendCode(isResend) {
    const phone = normPhone(S.fp.phone);
    if (!phone) return setFP({ err: 'Vui lòng nhập số điện thoại.' });
    if (!PHONE_RE.test(phone)) return setFP({ err: 'Số điện thoại không hợp lệ (10 số, bắt đầu bằng 03, 05, 07, 08 hoặc 09).' });
    return fpRun(async () => {
      const r = await api('POST', '/api/auth/forgot', { phone });
      const now = Date.now();
      setFP({ step: 'otp', phone, otp: '', ttl: r.expiresIn, expiresAt: now + r.expiresIn * 1000, resendAt: now + r.resendAfter * 1000 });
      startFpTimer();
      focusField('fp-otp');
      if (isResend) say('Đã gửi lại mã xác nhận.', 'info');
    });
  }
  function fpVerify() {
    const f = S.fp;
    if (f.otp.length !== OTP_LEN || !secondsLeft(f.expiresAt)) return;
    return fpRun(async () => {
      try {
        const r = await api('POST', '/api/auth/forgot/verify', { phone: f.phone, otp: f.otp });
        setFP({ step: 'reset', token: r.resetToken, otp: '' });
        focusField('fp-pass');
      } catch (e) { setFP({ otp: '' }); throw e; }
    });
  }
  function fpReset() {
    const f = S.fp;

    if (f.pass !== f.pass2) return setFP({ err: 'Mật khẩu nhập lại không khớp.' });
    return fpRun(async () => {
      const r = await api('POST', '/api/auth/forgot/reset', { resetToken: f.token, password: f.pass, confirm: f.pass2 });
      upd((n) => { n.fp = null; n.login.user = r.phone; n.login.pass = ''; n.login.show = false; n.login.err = ''; });
      say('Đặt lại mật khẩu thành công. Vui lòng đăng nhập bằng mật khẩu mới.', 'ok');

  const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  async function addFiles(pid, list) {
    const files = Array.from(list || []); if (!files.length) return;
    let ok = 0; const bad = [];
    for (const f of files) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (!isPdf) { bad.push(f.name + ' (không phải PDF)'); continue; }
      if (f.size > 10 * 1048576) { bad.push(f.name + ' (vượt 10 MB)'); continue; }
      const fd = new FormData(); fd.append('file', f);
      try { await api('POST', '/api/partners/' + encodeURIComponent(pid) + '/files', fd); ok++; } catch (e) { bad.push(f.name + ' (' + e.message + ')'); }
    }
    await sync().catch(() => {});
    if (bad.length) say((ok ? 'Đã tải lên ' + ok + ' file. ' : '') + 'Bỏ qua: ' + bad.join(', ') + '.', 'err');
    else say('Đã tải lên ' + ok + ' file PDF.', 'ok');

  function partnerStats(pid) {
    const type = pid.indexOf('NCC') === 0 ? 'in' : 'out';
    const rs = S.receipts.filter((r) => r.partner === pid && r.type === type);
    const appr = rs.filter((r) => r.status === 'approved'), pend = rs.filter((r) => r.status === 'pending');
    const agg = {};
    appr.forEach((r) => r.lines.forEach((l) => { const k = l.pid + '|' + r.wh; agg[k] = agg[k] || { pid: l.pid, wh: r.wh, qty: 0, last: r.date, refs: [] }; agg[k].qty += l.qty; agg[k].refs.push(r.code); }));
    const items = Object.keys(agg).map((k) => Object.assign(agg[k], { stock: have(agg[k].pid, agg[k].wh) }));
    const inStock = items.filter((x) => x.stock > 0);
    const pendLines = []; pend.forEach((r) => r.lines.forEach((l) => pendLines.push({ code: r.code, date: r.date, wh: r.wh, pid: l.pid, qty: l.qty, creator: r.creator, type: r.type })));
    const sum = (a) => a.reduce((x, y) => x + y.qty, 0);
    return { type, receipts: rs, approved: appr, pending: pend, items, inStock, pendLines, apprQty: sum(items), pendQty: sum(pendLines), last: rs[0] || null,

  function bindHome() {
    const el = document.getElementById('home'); if (!el) return;

    const end = () => {
      if (y0 === null) return; y0 = null; el.classList.remove('dragging');
      if (dy < -70) leaveHome(); else { el.style.transform = ''; if (!moved) leaveHome(); }
    };
    el.addEventListener('touchstart', (e) => start(e.touches[0].clientY), { passive: true });
    el.addEventListener('touchmove', (e) => move(e.touches[0].clientY), { passive: true });
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', (e) => { if (e.button === 0) start(e.clientY); });
    window.onmousemove = (e) => { if (S.home) move(e.clientY); };
    window.onmouseup = () => { if (S.home) end(); };
    el.addEventListener('wheel', (e) => { if (e.deltaY > 20) leaveHome(); }, { passive: true });

  }

  function viewReports() {
    const rw = S.rep.wh; const whIds = rw === 'all' ? S.warehouses.map((w) => w.id) : [rw];
    const tot = { begin: 0, inn: 0, out: 0, adj: 0, end: 0, value: 0 };
    const catVal = {};
    const data = S.products.map((p) => {
      const end = whIds.reduce((a, w) => a + have(p.id, w), 0); let inn = 0, out = 0, adj = 0;
      S.history.forEach((h) => { if (h.pid !== p.id || whIds.indexOf(h.wh) < 0) return; if (h.kind === 'Nhập') inn += h.delta; else if (h.kind === 'Xuất') out += -h.delta; else adj += h.delta; });
      const begin = end - inn + out - adj; const value = end * p.price;
      tot.begin += begin; tot.inn += inn; tot.out += out; tot.adj += adj; tot.end += end; tot.value += value;
      catVal[p.cat] = (catVal[p.cat] || 0) + value;
      return { p, begin, inn, out, adj, end, value };
    });
    const maxVal = Math.max.apply(null, data.map((x) => x.value)) || 1;
    const stats = statTiles([
      { label: 'Tồn đầu kỳ', value: fmt(tot.begin), icon: 'inventory', bg: '#ECEEF1', fg: '#2B3540', sub: 'đơn vị, đầu tháng 11' },
      { label: 'Nhập trong kỳ', value: '+' + fmt(tot.inn), icon: 'in', bg: '#E8F4EE', fg: '#13643A', color: '#13643A', sub: 'từ phiếu nhập đã duyệt' },
      { label: 'Xuất trong kỳ', value: '−' + fmt(tot.out), icon: 'out', bg: '#FDECEC', fg: '#A01F17', color: '#A01F17', sub: 'từ phiếu xuất đã duyệt' },
      { label: 'Giá trị tồn cuối kỳ', value: money(tot.value), icon: 'reports', bg: '#E6EFFF', fg: '#1A4FB8', sub: fmt(tot.end) + ' đơn vị' }
    ]);

    // waterfall
    const W = 560, Hh = 270, pl = 44, pr = 12, pt = 26, pb = 40;
    const stepsW = [['Tồn đầu kỳ', tot.begin, 'base'], ['Nhập', tot.inn, 'd'], ['Xuất', -tot.out, 'd'], ['Điều chỉnh', tot.adj, 'd'], ['Tồn cuối kỳ', tot.end, 'base']];
    let run = 0; const segs = stepsW.map((st) => { let a, b; if (st[2] === 'base') { a = 0; b = st[1]; run = st[1]; } else { a = run; b = run + st[1]; run = b; } return { label: st[0], v: st[1], a, b, base: st[2] === 'base' }; });
    const top = Math.max.apply(null, segs.map((g) => Math.max(g.a, g.b))) * 1.15 || 1;
    const nice = Math.pow(10, Math.floor(Math.log10(top))); const stepT = top / nice > 5 ? nice * 2 : top / nice > 2 ? nice : nice / 2;
    const yv = (v) => pt + (1 - v / top) * (Hh - pt - pb);
    const bw = 62, gapW = (W - pl - pr - 5 * bw) / 4;
    let g = '';
    for (let v = 0; v <= top; v += stepT) g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yv(v).toFixed(1) + '" y2="' + yv(v).toFixed(1) + '" stroke="#EEF1F4"/><text x="' + (pl - 8) + '" y="' + (yv(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#56606B">' + fmt(v) + '</text>';
    segs.forEach((sg, i) => {
      const x = pl + i * (bw + gapW); const y1 = yv(Math.max(sg.a, sg.b)), y2 = yv(Math.min(sg.a, sg.b)); const h = Math.max(2, y2 - y1);
      const col = sg.base ? '#0F2742' : sg.label === 'Điều chỉnh' ? '#7B61D1' : sg.v >= 0 ? '#2E9E62' : '#D9534F';
      g += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) + '" rx="5" fill="' + col + '"/>';
      g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y1 - 8).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + (sg.base ? '#17212B' : col) + '">' + (sg.base ? fmt(sg.v) : (sg.v === 0 ? '0' : sign(sg.v))) + '</text>';
      g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (Hh - pb + 20) + '" text-anchor="middle" font-size="12" fill="#3D4753">' + sg.label + '</text>';
      if (i < segs.length - 1) { const yy = yv(sg.b).toFixed(1); g += '<line x1="' + (x + bw).toFixed(1) + '" x2="' + (x + bw + gapW).toFixed(1) + '" y1="' + yy + '" y2="' + yy + '" stroke="#97A3B0" stroke-dasharray="4 4"/>'; }
    });
    const wf = '<section class="card" style="flex:3 1 480px;min-width:0">' + head('reports', '#E6EFFF', '#1A4FB8', 'Biến động tồn trong kỳ', 'Từ tồn đầu kỳ đến tồn cuối kỳ, đơn vị: số lượng') +
      '<div class="chartwrap" style="padding:16px 20px"><svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc('Tồn đầu ' + tot.begin + ', nhập ' + tot.inn + ', xuất ' + tot.out + ', điều chỉnh ' + tot.adj + ', tồn cuối ' + tot.end) + '" font-family="inherit">' + g + '</svg></div></section>';

    const cats = Object.keys(catVal).map((k) => [k, catVal[k]]).sort((a, b) => b[1] - a[1]);
    const cmax = cats.length ? cats[0][1] : 1; const CC = ['#1A56C4', '#2E9E62', '#E58A2E', '#7B61D1', '#0F2742'];
    const catCard = '<section class="card" style="flex:2 1 320px;min-width:0">' + head('products', '#EFEAFE', '#5B3FB6', 'Giá trị tồn theo danh mục', 'Tồn cuối kỳ × giá vốn') +
      '<div class="col g16" style="padding:18px 20px">' + cats.map((c, i) => '<div class="col" style="gap:6px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:14px"><span style="font-weight:500">' + esc(c[0]) + '</span><span><b>' + money(c[1]) + '</b> <span class="muted small">' + (tot.value ? Math.round(c[1] / tot.value * 100) : 0) + '%</span></span></div>' +
        '<div class="meter" style="height:10px"><span style="width:' + (c[1] / cmax * 100).toFixed(1) + '%;background:' + CC[i % CC.length] + '"></span></div></div>').join('') + '</div></section>';

    const cols = '84px minmax(170px,2fr) 96px 76px 76px 92px 100px 140px';
    const rows = data.map((x) => [cell(esc(x.p.sku), '', 'muted'), cell('<span class="col"><b style="font-weight:500">' + esc(x.p.name) + '</b><span class="muted small">' + esc(x.p.unit) + '</span></span>'), cell(fmt(x.begin), '', 'r'),
      cell(x.inn ? '+' + fmt(x.inn) : '0', x.inn ? 'color:#13643A;font-weight:600' : '', 'r'), cell(x.out ? '−' + fmt(x.out) : '0', x.out ? 'color:#A01F17;font-weight:600' : '', 'r'),
      cell(x.adj === 0 ? '0' : sign(x.adj), x.adj ? 'color:#5B3FB6;font-weight:600' : '', 'r'), cell(fmt(x.end), 'font-weight:700', 'r'),
      cell('<span class="col" style="gap:4px;align-items:flex-end"><span>' + fmt(x.value) + ' đ</span><span class="meter" style="width:100%;height:4px"><span style="width:' + (x.value / maxVal * 100).toFixed(0) + '%;background:#7FA6E8"></span></span></span>')]);
    const totalRow = '<div class="trow" style="grid-template-columns:' + cols + ';background:#0F2742;color:#FFFFFF;font-weight:700;border-bottom:0"><span></span><span>Tổng cộng</span><span class="r">' + fmt(tot.begin) + '</span><span class="r">+' + fmt(tot.inn) + '</span><span class="r">−' + fmt(tot.out) + '</span><span class="r">' + (tot.adj === 0 ? '0' : sign(tot.adj)) + '</span><span class="r">' + fmt(tot.end) + '</span><span class="r">' + fmt(tot.value) + ' đ</span></div>';
    const tbl = table(cols, ['SKU', 'Hàng hóa', { t: 'Tồn đầu kỳ', r: 1 }, { t: 'Nhập', r: 1 }, { t: 'Xuất', r: 1 }, { t: 'Điều chỉnh', r: 1 }, { t: 'Tồn cuối kỳ', r: 1 }, { t: 'Giá trị tồn', r: 1 }], rows, 960).replace(/<\/div><\/div>$/, totalRow + '</div></div>');
    const whOpts = [{ id: 'all', name: 'Tất cả kho' }].concat(S.warehouses);
    return '<div class="col g20">' +
      '<div class="card wrap g16" style="padding:16px 20px;align-items:flex-end;justify-content:space-between"><div class="wrap" style="gap:20px;align-items:flex-end">' +
      '<div class="col" style="gap:6px"><span class="lbl">Kỳ báo cáo</span><span class="pill on" style="display:inline-flex;align-items:center;gap:8px;cursor:default">' + svg('reports', 14) + 'Tháng 11/2026</span></div>' +
      '<div class="col" style="gap:6px"><span class="lbl">Kho</span>' + pills(whOpts.map((w) => ({ label: w.name, on: w.id === rw, pick: () => upd((n) => { n.rep.wh = w.id; }) }))) + '</div></div>' +
      '<div class="wrap g10">' + btn('Xuất Excel', () => say('Đã tạo BaoCao_NXT_T11-2026.xlsx (mô phỏng trên prototype).', 'info')) + btn('Xuất PDF', () => say('Đã tạo BaoCao_NXT_T11-2026.pdf (mô phỏng trên prototype).', 'info')) + '</div></div>' +

      const screen = (S.screen === 'users' && !isAdmin()) || (S.screen === 'receipts' && !canApprove()) ? 'dashboard' : S.screen;
      const low = lowList();
      const views = { dashboard: () => viewDashboard(low), in: () => viewReceipts('in'), out: () => viewReceipts('out'), stocktake: viewStocktake, inventory: viewInventory, alerts: () => viewAlerts(low), reports: viewReports, products: viewProducts, suppliers: viewPartners, customers: viewPartners, warehouses: viewWarehouses, receipts: viewReceiptBook, users: viewUsers };
      html = '<div class="layout">' + viewSidebar(screen, low) + '<main>' + viewTop(screen === 'customers' && hideContact('cus') ? ['Khách hàng', 'Hàng đã xuất, phiếu chờ duyệt và ghi chú (FR-05)'] : screen === 'suppliers' && hideContact('sup') ? ['Nhà cung cấp', 'Hàng đã nhập, phiếu chờ duyệt và ghi chú (FR-04)'] : PAGES[screen]) + (views[screen] || views.dashboard)() + '</main></div>';
      prevScreen = screen;
    }
    if (S.loggedIn && S.act) html += viewActivity();
    if (S.loggedIn && S.rview) html += viewReceiptDialog();

    if (S.loggedIn && S.wdel) html += viewWhDeleteDialog();
    if (S.loggedIn && S.kpick && S.wf.open) html += viewKeeperPicker();
    if (S.toast) html += '<div class="toast" role="status" style="background:' + (TONE[S.toast.tone] || TONE.info) + '">' + esc(S.toast.text) + '</div>';

  }

  // hover popup for partners
  const HP = document.createElement('div'); HP.className = 'hpop'; HP.setAttribute('role', 'tooltip'); HP.id = 'hpop'; document.body.appendChild(HP);
  let hpTarget = null, hpTimer = null;
  function hpHtml(pid) {
    const x = S.suppliers.concat(S.customers).find((y) => y.id === pid); if (!x) return '';
    const st = partnerStats(pid); const isSup = st.type === 'in'; const hide = hideContact(isSup ? 'sup' : 'cus'); const c = avOf(pid);
    const lowIn = st.inStock.filter((y) => y.stock <= prod(y.pid).min).length;
    return '<div class="hp-head"><span class="avatar" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(initialsOf(x.name)) + '</span><div class="col" style="gap:2px;min-width:0"><b style="font-size:14px">' + esc(x.name) + '</b><span class="muted small">' + esc(x.id) + ', ' + (isSup ? 'Nhà cung cấp' : 'Khách hàng') + '</span></div></div>' +
      (hide ? '<div class="hp-sec" style="padding-top:12px"><span class="muted" style="display:flex;gap:8px;align-items:center">' + svg('lock', 14) + 'Thông tin liên hệ được ẩn theo phân quyền</span></div>' : '<div class="hp-sec" style="padding-top:12px">' + (x.phone ? '<span style="display:flex;gap:8px;align-items:center">' + svg('phone', 14) + esc(fmtPhone(x.phone)) + '</span>' : '') + (x.email ? '<span style="display:flex;gap:8px;align-items:center">' + svg('mail', 14) + esc(x.email) + '</span>' : '') + (x.address ? '<span class="muted" style="display:flex;gap:8px;align-items:center">' + svg('partners', 14) + esc(x.address) + '</span>' : '') + '</div>') +
      '<div class="hp-grid">' + (isSup
        ? '<div><span class="muted small">Đã nhập</span><b>' + st.products + '</b><span class="muted small">' + fmt(st.apprQty) + ' đv</span></div><div><span class="muted small">Còn trong kho</span><b style="color:#13643A">' + st.stockProducts + '</b><span class="muted small">' + (lowIn ? lowIn + ' tồn thấp' : 'mặt hàng') + '</span></div>'
        : '<div><span class="muted small">Đã xuất</span><b>' + st.products + '</b><span class="muted small">mặt hàng</span></div><div><span class="muted small">Số lượng</span><b style="color:#13643A">' + fmt(st.apprQty) + '</b><span class="muted small">đơn vị</span></div>') +
      '<div><span class="muted small">Chờ duyệt</span><b style="color:' + (st.pending.length ? '#8A4B00' : '#17212B') + '">' + st.pending.length + '</b><span class="muted small">' + fmt(st.pendQty) + ' đv</span></div></div>' +
      (st.pendLines.length ? '<div class="hp-sec"><span class="muted small">Đang chờ duyệt</span>' + st.pendLines.slice(0, 3).map((l) => '<span>' + esc(prod(l.pid).name) + ' × ' + fmt(l.qty) + ' <span class="muted">(' + esc(l.code) + ')</span></span>').join('') + '</div>' : '') +
      '<div class="hp-sec"><span class="muted small">Giao dịch gần nhất</span><span>' + (st.last ? esc(st.last.code + ', ' + st.last.date + ', ') + ST[st.last.status].t.toLowerCase() : 'Chưa có giao dịch') + '</span></div>' +
      (x.note ? '<div class="hp-sec"><span class="muted small">Ghi chú</span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(x.note) + '</span></div>' : '') +
      '<div class="hp-foot">' + (hide ? '' : st.files + ' hồ sơ PDF. ') + 'Bấm “Chi tiết” để xem đầy đủ.</div>';
  }
  function hpShow(t) {
    hpTarget = t; clearTimeout(hpTimer);
    hpTimer = setTimeout(() => {
      if (hpTarget !== t || !document.body.contains(t)) return;
      HP.innerHTML = hpHtml(t.dataset.hp); t.setAttribute('aria-describedby', 'hpop');
      const r = t.getBoundingClientRect(); const w = HP.offsetWidth, h = HP.offsetHeight;
      let left = r.left, top = r.bottom + 8;
      if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
      left = Math.min(Math.max(12, left), window.innerWidth - w - 12);
      HP.style.left = left + 'px'; HP.style.top = top + 'px'; HP.classList.add('show');
    }, 180);
  }
  function hpHide() { clearTimeout(hpTimer); if (hpTarget) hpTarget.removeAttribute('aria-describedby'); hpTarget = null; HP.classList.remove('show'); }
  root.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-hp]'); if (t && t !== hpTarget) hpShow(t); });
  root.addEventListener('mouseout', (e) => { const t = e.target.closest('[data-hp]'); if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) hpHide(); });
  root.addEventListener('focusin', (e) => { const t = e.target.closest('[data-hp]'); if (t) hpShow(t); });
  root.addEventListener('focusout', (e) => { if (e.target.closest('[data-hp]')) hpHide(); });
  window.addEventListener('scroll', hpHide, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hpHide(); });
  // PDF upload: picker + drag & drop
  root.addEventListener('change', (e) => { const t = e.target; if (t.dataset && t.dataset.file) addFiles(t.dataset.file, t.files); });
  root.addEventListener('dragover', (e) => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  root.addEventListener('dragleave', (e) => { const d = e.target.closest('[data-drop]'); if (d && !(e.relatedTarget && d.contains(e.relatedTarget))) d.classList.remove('over'); });
  root.addEventListener('drop', (e) => { const d = e.target.closest('[data-drop]'); if (d) { e.preventDefault(); addFiles(d.dataset.drop, e.dataTransfer.files); } });
  root.addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (b && H[b.dataset.c]) H[b.dataset.c](e); });
  root.addEventListener('input', (e) => { const t = e.target; if (t.dataset && t.dataset.i && H[t.dataset.i]) H[t.dataset.i]({ target: t }); });
  root.addEventListener('change', (e) => { const t = e.target; if (t.dataset && t.dataset.ch && H[t.dataset.ch]) H[t.dataset.ch]({ target: t }); });
  root.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !S.loggedIn && !S.home && e.target.tagName === 'INPUT') (S.fp ? fpSubmit() : doLogin()); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.fp && !S.loggedIn) closeForgot(); }); // AUTH-08
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.udel || S.wdel || S.kpick || S.act || S.rview)) upd((n) => { n.udel = null; n.wdel = null; n.kpick = null; n.act = null; n.rview = null; }); });
  root.addEventListener('mousedown', (e) => { if ((S.udel || S.wdel || S.kpick || S.act || S.rview) && e.target.dataset && e.target.dataset.overlay) upd((n) => { n.udel = null; n.wdel = null; n.kpick = null; n.act = null; n.rview = null; }); });
  document.addEventListener('keydown', (e) => { if (S.home && !S.loggedIn && ['ArrowUp', 'ArrowDown', 'PageDown', 'Enter', ' '].indexOf(e.key) >= 0) { e.preventDefault(); leaveHome(); } });

  render();
  (async () => {
    await loadPublic();
    try { const r = await api('GET', '/api/auth/me'); if (r.user) await sync(); } catch (e) { /* chưa đăng nhập hoặc máy chủ chưa chạy */ }
  })();
})();
</script>
</body>
</html>
