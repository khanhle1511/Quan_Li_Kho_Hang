# =====================================================================
#  Cấu hình khi deploy online (Render + MySQL hoặc PostgreSQL trên cloud).
#  Bật bằng biến môi trường: SPRING_PROFILES_ACTIVE=prod
#  Mọi thông tin bí mật lấy từ biến môi trường, KHÔNG ghi thẳng vào file.
#  DB_URL phải là chuỗi JDBC: jdbc:mysql://... hoặc jdbc:postgresql://...
#  Driver và dialect được Spring Boot tự chọn theo tiền tố của DB_URL.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Gói free có ít kết nối: giữ pool nhỏ
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=280000

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Cookie phiên đăng nhập chỉ gửi qua HTTPS
# Đặt COOKIE_SECURE=false nếu chạy profile prod trên http://localhost để thử
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
